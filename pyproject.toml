[project]
name = "phase0-bootstrapper"
version = "0.1.0"
description = "A day-zero installer that brings an unknown repo to the living convention surface."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

# Not an installable package: the deliverable is the Agent Skill, and the sensor
# is a standalone stdlib script (scripts/scan.py). uv manages only the dev env.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
src = ["scripts", "tests"]
# Sample repos used only as static-analysis input; not our code to lint.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q"
