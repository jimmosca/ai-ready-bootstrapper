[project]
name = "phase0-bootstrapper"
version = "0.1.0"
description = "Read-only repository analysis that generates a Phase 0 context pack for coding agents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
phase0 = "phase0_bootstrapper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phase0_bootstrapper"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Sample repos used only as static-analysis input; not our code to lint.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
